worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

[merge]
# Never collapse a branch's commits into one. Commit boundaries are chosen
# deliberately while the work is done, and squashing discards them.
squash = false

# Rebase before merging (wt's default, kept explicit because it is a
# deliberate choice): a conflict then surfaces in the branch's own worktree,
# leaving the target untouched until the branch is clean.
rebase = true
